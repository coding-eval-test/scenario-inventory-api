name: Template health

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-shipping-state:
    name: Verify the template ships in the intended state
    # Template copies inherit this workflow. Only run it in the source repository.
    if: github.repository == 'coding-eval-test/scenario-inventory-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # scenario.json is the single source of truth for the work items and their
      # points. check.sh parses it with sed, which is only safe while the file
      # stays in jq's canonical one-key-per-line shape — so assert that first.
      - name: scenario.json must be canonically formatted
        shell: bash
        run: |
          if ! diff <(jq --indent 2 . scenario.json) scenario.json; then
            echo "::error::scenario.json is not canonically formatted. Run: jq --indent 2 . scenario.json | sponge scenario.json"
            exit 1
          fi
          echo "scenario.json is canonical."

      - name: scenario.json must name this repository
        shell: bash
        run: |
          declared=$(jq -r '.templateRepo' scenario.json)
          if [ "$declared" != "${GITHUB_REPOSITORY}" ]; then
            echo "::error::scenario.json templateRepo is '${declared}' but this repo is '${GITHUB_REPOSITORY}'."
            echo "::error::The job guard above is keyed off the same slug — fix both together."
            exit 1
          fi
          echo "templateRepo matches ${GITHUB_REPOSITORY}."

      - name: README grading table must match scenario.json
        shell: bash
        run: |
          {
            echo "| Work item | Points |"
            echo "| --- | --- |"
            jq -r '.categories[] | "| \(.label) | \(.points) |"' scenario.json
          } > /tmp/expected-table.md

          sed -n '/<!-- grading-table:start -->/,/<!-- grading-table:end -->/p' README.md \
            | sed '1d;$d' > /tmp/actual-table.md

          if ! diff /tmp/expected-table.md /tmp/actual-table.md; then
            echo "::error::The README grading table does not match scenario.json. Left is expected."
            exit 1
          fi
          echo "README grading table matches scenario.json."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build must succeed
        run: dotnet build --configuration Release

      # Regression is the one category with inverted semantics — it must pass —
      # so it stays named explicitly rather than coming from the manifest loop.
      - name: Regression suite must be green
        run: dotnet test --no-build --configuration Release --filter Category=Regression

      - name: Every work item must ship red, and must have tests
        shell: bash
        run: |
          problems=0
          while read -r category; do
            passed=0
            dotnet test --no-build --configuration Release \
              --filter "Category=${category}" \
              --logger "trx;LogFileName=${category}.trx" \
              --results-directory TestResults < /dev/null > /dev/null 2>&1 && passed=1

            found=0
            if [ -f "TestResults/${category}.trx" ]; then
              found=$(sed -n 's/.*<Counters[^>]*total="\([0-9]*\)".*/\1/p' \
                        "TestResults/${category}.trx" | head -1)
              found=${found:-0}
            fi

            # An empty category is a scenario bug: the grader would report NO TESTS
            # and the work item would be unscoreable. Fail loudly here, in the one
            # repo where it can still be fixed before trainees copy it.
            if [ "$found" -eq 0 ]; then
              echo "::error::No tests carry Category=${category}. scenario.json and the test traits disagree."
              problems=1
            elif [ "$passed" -eq 1 ]; then
              echo "::error::Category ${category} PASSES in the template. It must ship failing."
              problems=1
            else
              echo "Category ${category} fails as intended (${found} tests)."
            fi
          done < <(jq -r '.categories[] | select(.category != "Regression") | .category' scenario.json)
          exit $problems

      # Derived from the code rather than hardcoded, so a new scenario inherits the
      # check for free. The domain-specific half of this — the APIs a fix actually
      # uses — lives in the private solution repo, because naming them here would
      # leak them: this file is public and trainees clone it.
      - name: Docs must not leak the solution
        shell: bash
        run: |
          mapfile -t allow < <(jq -r '.docsAllowList // [] | .[]' scenario.json)

          names=$(grep -rhoE '\b(class|interface|record|struct|enum) [A-Za-z0-9_]+' \
                    --include='*.cs' src/*/Services/ \
                    | awk '{print $2}' | sort -u)

          for entry in "${allow[@]}"; do
            names=$(printf '%s\n' "$names" | grep -vxF "$entry" || true)
          done

          if [ -z "$names" ]; then
            echo "::error::No service type names found under src/*/Services — the leak check is not actually checking anything."
            exit 1
          fi

          pattern=$(printf '%s\n' "$names" | paste -sd '|' -)
          echo "Checking trainee-facing docs against: ${pattern}"

          if grep -rnwE "$pattern" docs/ README.md; then
            echo "::error::Implementation detail leaked into trainee-facing docs."
            echo "::error::If a name legitimately belongs in prose, add it to docsAllowList in scenario.json."
            exit 1
          fi
          echo "No solution leakage detected."

  devcontainer-build:
    name: Devcontainer must build
    # Template copies inherit this workflow. Only run it in the source repository.
    if: github.repository == 'coding-eval-test/scenario-inventory-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # A broken devcontainer (e.g. the sshd-feature/apt NO_PUBKEY incident) fails
      # silently in Codespaces, which falls back to a recovery container instead of
      # surfacing the error. Build it here so a bad devcontainer.json fails the push.
      - name: Devcontainer must build
        uses: devcontainers/ci@v0.3
        with:
          push: never
