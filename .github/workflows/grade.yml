name: Grade

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    name: Score submission
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the submission
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # A work item scores its points only when the whole category passes.
      # The job always exits 0: a partial score is work in progress, not a broken build.
      #
      # Work items, their points, and their labels all come from scenario.json —
      # editing that one file is how a scenario changes what it grades.
      #
      # Exit code alone is not enough. `dotnet test --filter Category=X` exits 0 when
      # NOTHING matches X, so a mistyped or missing category would otherwise be paid in
      # full. The test count from the .trx is what tells "all passed" from "none ran".
      - name: Score every work item
        id: score
        shell: bash
        run: |
          total=0
          max=0
          json_items=""

          {
            echo "## Scorecard"
            echo ""
            echo "| Work item | Result | Points |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS=$'\t' read -r category worth label; do
            max=$((max + worth))

            # stdin is redirected: without it dotnet test would eat the rest of
            # the manifest off this loop's stdin and only the first item would score.
            echo "::group::${category} — ${label}"
            if dotnet test --no-build --configuration Release \
                 --filter "Category=${category}" \
                 --logger "trx;LogFileName=${category}.trx" \
                 --results-directory TestResults < /dev/null; then
              suite_passed=1
            else
              suite_passed=0
            fi
            echo "::endgroup::"

            found=0
            if [ -f "TestResults/${category}.trx" ]; then
              found=$(sed -n 's/.*<Counters[^>]*total="\([0-9]*\)".*/\1/p' \
                        "TestResults/${category}.trx" | head -1)
              found=${found:-0}
            fi

            if [ "$found" -eq 0 ]; then
              earned=0
              result="no-tests"
              icon="NO TESTS"
              echo "::warning::No tests carry Category=${category}. Scoring 0 — check scenario.json against the test traits."
            elif [ "$suite_passed" -eq 1 ]; then
              earned="$worth"
              result="pass"
              icon="PASS"
            else
              earned=0
              result="fail"
              icon="FAIL"
            fi

            total=$((total + earned))
            echo "| ${label} | ${icon} | ${earned} / ${worth} |" >> "$GITHUB_STEP_SUMMARY"

            if [ -n "$json_items" ]; then
              json_items="${json_items},"
            fi
            json_items="${json_items}{\"category\":\"${category}\",\"label\":\"${label}\",\"result\":\"${result}\",\"tests\":${found},\"earned\":${earned},\"possible\":${worth}}"
          done < <(jq -r '.categories[] | [.category, .points, .label] | @tsv' scenario.json)

          {
            echo "| **Total** | | **${total} / ${max}** |"
            echo ""
            echo "Run \`./scripts/check.sh\` (or \`./scripts/check.ps1\`) locally for the same per-item split."
          } >> "$GITHUB_STEP_SUMMARY"

          cat > score.json <<JSON
          {
            "repository": "${GITHUB_REPOSITORY}",
            "sha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "total": ${total},
            "possible": ${max},
            "items": [${json_items}]
          }
          JSON

          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "possible=${max}" >> "$GITHUB_OUTPUT"
          echo "Scored ${total}/${max}."

      - name: Upload score.json
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.json
          if-no-files-found: error
