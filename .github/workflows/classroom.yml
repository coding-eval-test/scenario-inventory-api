name: Autograding

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  grade:
    name: Grade submission
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the submission
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: S1 reserve stock on placement
        id: s1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: S1 reserve stock on placement
          command: dotnet test --no-build --configuration Release --filter Category=S1
          timeout: 10
          max-score: 20

      - name: S2 cancel an order
        id: s2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: S2 cancel an order
          command: dotnet test --no-build --configuration Release --filter Category=S2
          timeout: 10
          max-score: 15

      - name: S3 low-stock report
        id: s3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: S3 low-stock report
          command: dotnet test --no-build --configuration Release --filter Category=S3
          timeout: 10
          max-score: 15

      - name: B1 order totals
        id: b1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: B1 order totals
          command: dotnet test --no-build --configuration Release --filter Category=B1
          timeout: 10
          max-score: 15

      - name: B2 product search
        id: b2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: B2 product search
          command: dotnet test --no-build --configuration Release --filter Category=B2
          timeout: 10
          max-score: 15

      - name: Existing behaviour must keep working
        id: regression
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Existing behaviour (regression)
          command: dotnet test --no-build --configuration Release --filter Category=Regression
          timeout: 10
          max-score: 20

      - name: Report the score
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          S1_RESULTS: "${{ steps.s1.outputs.result }}"
          S2_RESULTS: "${{ steps.s2.outputs.result }}"
          S3_RESULTS: "${{ steps.s3.outputs.result }}"
          B1_RESULTS: "${{ steps.b1.outputs.result }}"
          B2_RESULTS: "${{ steps.b2.outputs.result }}"
          REGRESSION_RESULTS: "${{ steps.regression.outputs.result }}"
        with:
          runners: s1,s2,s3,b1,b2,regression
